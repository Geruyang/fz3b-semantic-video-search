[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desktop-vlm-research"
version = "0.1.0"
description = "Offline MobileCLIP-S1 research reference and signed INT8 dot-product experiment"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8"]
model = ["torch==2.8.0", "torchvision==0.23.0", "timm==1.0.22", "open-clip-torch==3.2.0"]

[project.scripts]
desktop-vlm = "desktop_vlm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
